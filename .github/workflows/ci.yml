name: gooo release transport conformance

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gooo-release-transport-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0

      - name: Install Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false

      - name: Verify toolchain and source boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(go env GOVERSION)" = "go1.27.0"
          test "$(go env GOOS)" = "linux"
          test "$(go env GOARCH)" = "amd64"
          test "$(git ls-files 'README.md' | wc -l | tr -d ' ')" = 1
          EVIDENCE_ROOT="$RUNNER_TEMP/gooo-release-transport"
          echo "EVIDENCE_ROOT=$EVIDENCE_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_ROOT/metrics" "$EVIDENCE_ROOT/generated" "$EVIDENCE_ROOT/integration"

      - name: Run semantic audit
        run: ./scripts/semantic-audit.sh "$GITHUB_WORKSPACE"

      - name: Measure compile stage
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/measure-command.sh "$EVIDENCE_ROOT/metrics/compile.json" compile "$EVIDENCE_ROOT/metrics/compile.log" go test -run '^$' ./...

      - name: Measure build stage
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/measure-command.sh "$EVIDENCE_ROOT/metrics/build.json" build "$EVIDENCE_ROOT/metrics/build.log" go build -trimpath -o "$EVIDENCE_ROOT/gooo-release-transport-conformer" ./cmd/gooo-release-transport-conformer

      - name: Run Go vet
        run: go vet ./...

      - name: Measure test stage
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/measure-command.sh "$EVIDENCE_ROOT/metrics/test.json" test "$EVIDENCE_ROOT/metrics/test.log" go test -count=1 ./...

      - name: Measure fixed conformance stage
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/measure-command.sh "$EVIDENCE_ROOT/metrics/conformance.json" conformance "$EVIDENCE_ROOT/metrics/conformance.log" ./scripts/conformance.sh "$GITHUB_WORKSPACE" "$EVIDENCE_ROOT/gooo-release-transport-conformer" "$EVIDENCE_ROOT/generated"

      - name: Measure generated artifact integration stage
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/measure-command.sh "$EVIDENCE_ROOT/metrics/integration.json" integration "$EVIDENCE_ROOT/metrics/integration.log" ./scripts/integration.sh "$GITHUB_WORKSPACE" "$EVIDENCE_ROOT/gooo-release-transport-conformer" "$EVIDENCE_ROOT/integration"

      - name: Assemble exact CI evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f "$EVIDENCE_ROOT/generated/conformance-receipt.json" ]]; then
            ./scripts/assemble-ci-evidence.sh "$GITHUB_WORKSPACE" "$EVIDENCE_ROOT/generated" "$EVIDENCE_ROOT/metrics"
            jq -e '.stages | length == 5 and all(.[]; (.wall_ms|type) == "number" and (.peak_rss_kib|type) == "number")' "$EVIDENCE_ROOT/metrics/ci-evidence.json" >/dev/null
          fi

      - name: Publish step summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f "$EVIDENCE_ROOT/generated/conformance-receipt.json" ]]; then
            jq -r '"decision=\(.decision) denominator=\(.denominator) CLOSED=\(.summary.CLOSED) UNKNOWN=\(.summary.UNKNOWN) REFUTED=\(.summary.REFUTED)"' "$EVIDENCE_ROOT/generated/conformance-receipt.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f "$EVIDENCE_ROOT/metrics/ci-evidence.json" ]]; then
            jq -r '"five stages measured; Go files=\(.inventory.go_files), Gooo files=\(.inventory.gooo_files), local_go_tests=\(.authority.local_go_tests)"' "$EVIDENCE_ROOT/metrics/ci-evidence.json" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gooo-release-transport-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/gooo-release-transport
          if-no-files-found: error
